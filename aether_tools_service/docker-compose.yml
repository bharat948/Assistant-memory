version: "3.8"
services:
 tools-api:
   build: 
     context: ..
     dockerfile: aether_tools_service/Dockerfile
   ports:
     - "8000:8000"
   env_file:
     - ../aether_agent/.env
   volumes:
     - ../aether_tools_service/app:/app/aether_tools_service/app
     - ../aether_agent/agent/examples:/app/aether_agent/agent/examples
   command: ["uvicorn", "aether_tools_service.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
