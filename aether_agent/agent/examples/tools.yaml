tools:
 - id: echo-tool
   name: EchoTool
   description: "A simple tool that takes any JSON payload and echoes it back. Useful for testing and debugging."
   type: local
   local_handler: sample_tools.echo # Points to app/sample_tools.py function 'echo'
   input_schema:
     type: object
     properties:
       message:
         type: string
         description: "The message to be echoed back."
     required: ["message"]
 - id: adder-tool
   name: CalculatorTool
   description: "A tool that calculates the sum of two numbers, 'a' and 'b'."
   type: local
   local_handler: sample_tools.add # Points to app/sample_tools.py function 'add'
   input_schema:
     type: object
     properties:
       a:
         type: number
         description: "The first number."
       b:
         type: number
         description: "The second number."
     required: ["a", "b"]
 - id: user-info-tool
   name: UserInformationTool
   description: "Fetches information about a single user by their ID from an external user API."
   type: http
   endpoint: "https://jsonplaceholder.typicode.com/users/{user_id}"
   method: GET
   input_schema:
     type: object
     properties:
       user_id:
         type: integer
         description: "The numeric ID of the user to fetch."
     required: ["user_id"]
